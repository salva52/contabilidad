<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio Contabilidad General</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: cabecera fija con progreso, menú de temas a la izquierda (arriba en móvil), un tema por vista. Las hojas imitan el papel del examen. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#162033; --muted:#566277; --line:#d8dee8;
  --accent:#2748c4; --accent-soft:#e7ecfb; --accent-ink:#ffffff;
  --ok:#11763b; --ok-soft:#e1f3e8; --bad:#b3261e; --bad-soft:#fbe6e4; --note-soft:#fff4d6; --note-ink:#6b4a00;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1521; --surface:#172033; --ink:#e8edf7; --muted:#9aa7bd; --line:#2a3650;
    --accent:#8fa7ff; --accent-soft:#222f57; --accent-ink:#0f1521;
    --ok:#6fd699; --ok-soft:#143021; --bad:#ff9189; --bad-soft:#3b1b1a; --note-soft:#3a3016; --note-ink:#f1d27a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1521; --surface:#172033; --ink:#e8edf7; --muted:#9aa7bd; --line:#2a3650;
  --accent:#8fa7ff; --accent-soft:#222f57; --accent-ink:#0f1521;
  --ok:#6fd699; --ok-soft:#143021; --bad:#ff9189; --bad-soft:#3b1b1a; --note-soft:#3a3016; --note-ink:#f1d27a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55}
h1,h2,h3,h4{text-wrap:balance;line-height:1.25;margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.92em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:600;font-size:1.05rem;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.overall{flex:1;min-width:220px}
.overall-row{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.overall-row b{color:var(--ink)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.ok>span{background:var(--ok)}

.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 20px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.nav{position:sticky;top:84px;display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:10px 12px;border-radius:10px;border:1px solid transparent;font-weight:500}
.nav a:hover{background:var(--accent-soft)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .cnt{font-family:var(--mono);font-size:.8rem;opacity:.85;white-space:nowrap}
.nav a.full .cnt::after{content:" ✓"}
main{min-width:0}

.thead{margin-bottom:18px}
.thead h2{font-size:1.9rem;margin-bottom:6px}
.thead .sub{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.thead .bar{max-width:420px}
.sec{margin:34px 0 12px;font-size:1.25rem;display:flex;align-items:center;gap:10px}
.sec .tag{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.card h3{font-size:1.1rem;margin-bottom:4px}
.rule ul,.rule ol{margin:8px 0 0;padding-left:22px}
.rule li{margin:5px 0}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.exh h4{font-size:1.1rem}
.src{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.pill{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.enun{margin:6px 0 12px}
.enun p{margin:6px 0}
.enun ul{margin:6px 0;padding-left:22px}
.stp{margin:22px 0 6px;font-size:1rem;display:flex;align-items:center;gap:10px}
.stp .n{display:inline-flex;align-items:center;justify-content:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.85rem;font-weight:600}
.steps{margin:4px 0 0;padding-left:22px}
.steps li{margin:7px 0}
.note{background:var(--note-soft);color:var(--note-ink);border-radius:10px;padding:10px 14px;margin:14px 0 0;font-size:.95rem}
.leg{margin:10px 0 0;padding:10px 14px 10px 34px;background:var(--accent-soft);border-radius:10px;font-size:.92rem}
.leg li{margin:3px 0}
.mk{display:inline-flex;align-items:center;justify-content:center;width:1.4em;height:1.4em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:600;margin-right:6px;vertical-align:middle}

.tw{overflow-x:auto;margin:8px 0 4px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{background:var(--accent-soft);font-weight:600;font-size:.82rem;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.b td{font-weight:600;background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.tcap{font-size:.85rem;color:var(--muted);margin:14px 0 0;font-weight:600}

/* Hoja de asientos (formato del examen) */
.hoja{min-width:600px}
.hoja td.f{width:70px;font-family:var(--mono);color:var(--muted)}
.hoja td.ad{width:70px;font-family:var(--mono);text-align:center}
.hoja td.ind{padding-left:34px}
.hoja tr.gl td{font-style:italic;color:var(--muted);border-top:1px dashed var(--line)}
.hoja select{font:inherit;width:100%;min-width:230px;padding:7px 8px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.hoja input{font:inherit;font-family:var(--mono);width:110px;padding:7px 8px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:right}
.hoja input.glin{width:100%;font-family:var(--font);text-align:left;font-style:italic}
.hoja tr.ok select,.hoja tr.ok input.vn{border-color:var(--ok);background:var(--ok-soft)}
.hoja tr.bad select,.hoja tr.bad input.vn{border-color:var(--bad);background:var(--bad-soft)}
.hoja .rm{display:block;font-size:.78rem;margin-top:2px;font-family:var(--font)}
.hoja tr.ok .rm{color:var(--ok)}
.hoja tr.bad .rm{color:var(--bad)}

/* Kardex */
.kx{min-width:880px;font-size:.9rem}
.kx th{text-align:center}
.kx td{padding:6px 8px}
.kx td.na{background:color-mix(in srgb,var(--line) 35%,transparent)}
.kx input{font:inherit;font-family:var(--mono);width:5.6rem;padding:6px 6px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:right}
.kx input.ok{border-color:var(--ok);background:var(--ok-soft)}
.kx input.bad{border-color:var(--bad);background:var(--bad-soft)}

/* Estados financieros */
.stmt td.msg{width:150px;font-size:.8rem}
.stmt tr.sh td{background:var(--accent-soft);font-weight:600;font-size:.85rem;letter-spacing:.02em}
.stmt td.n input{font:inherit;font-family:var(--mono);width:140px;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:right}
.stmt tr.ok input{border-color:var(--ok);background:var(--ok-soft)}
.stmt tr.bad input{border-color:var(--bad);background:var(--bad-soft)}
.stmt tr.ok td.msg{color:var(--ok)}
.stmt tr.bad td.msg{color:var(--bad)}

/* Campos sueltos (cálculos) */
.btn{font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:10px;min-height:42px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:8px}
.field label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:4px}
.field input,.field select{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.field input{font-family:var(--mono)}
.field.ok input,.field.ok select{border-color:var(--ok);background:var(--ok-soft)}
.field.bad input,.field.bad select{border-color:var(--bad);background:var(--bad-soft)}
.field .msg{font-size:.82rem;min-height:1.1em;margin-top:3px}
.field.ok .msg{color:var(--ok)}
.field.bad .msg{color:var(--bad)}
.hintline{font-size:.85rem;color:var(--muted);margin:12px 0 0}
.feedback{margin:12px 0 0;font-weight:600;min-height:1.4em}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
details.sol{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
details.sol summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid2 .card{margin:0}
.grid2 h4{margin-bottom:6px}
.grid2 p{margin:4px 0}
.tlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tlinks a{padding:8px 14px;border-radius:99px;background:var(--accent-soft);text-decoration:none;font-weight:500}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px}
.pager a{text-decoration:none;font-weight:500;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pager a:hover{background:var(--accent-soft)}
.reset{max-width:1180px;margin:0 auto;padding:16px 16px 48px;font-size:.9rem;color:var(--muted)}
.reset .btn{margin-right:8px;margin-top:6px}

.teach{background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin:6px 0 12px;font-size:.95rem}
.teach p{margin:4px 0}
.teach ul,.teach ol{margin:6px 0;padding-left:20px}
.teach li{margin:3px 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;align-items:start}
.two .tw{margin:0}
.stp .pr{margin-left:auto}
.blk{padding-bottom:6px}
.xs{margin:14px 0}
.xh{margin:14px 0 6px;font-size:1rem;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--line,#ccc);padding-bottom:4px}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px}
  .nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:8px}
  .nav a{white-space:nowrap;background:var(--surface);border-color:var(--line)}
  .thead h2{font-size:1.5rem}
  body{font-size:16px}
  .card{padding:16px}
}
@media (prefers-reduced-motion: reduce){.bar>span{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Contabilidad General<small>Kardex, ajustes y estados financieros</small></div>
    <div class="overall">
      <div class="overall-row"><span>Progreso total <b id="ovPct">0%</b></span><span id="ovTxt">0 de 0</span></div>
      <div class="bar" id="ovBar" role="progressbar" aria-label="Progreso total" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    </div>
  </div>
</header>
<div class="wrap">
  <nav class="nav" id="nav" aria-label="Temas"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<footer class="reset foot"><div id="resetBox"><button type="button" class="btn" id="resetBtn">Borrar progreso</button></div></footer>

<script>
(function(){
'use strict';

/* ---------- Utilidades ---------- */
function m(n){
  if(n===null||n===undefined||n==='') return '';
  if(typeof n==='string') return n;
  if(n<0) return '('+m(-n)+')';
  if(Number.isInteger(n)) return n.toLocaleString('en-US');
  return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function mu(n){ return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4}); }
function isNumCell(s){ return s!=='' && /^[\d(),.\-–%\s]+$/.test(s); }
function parseNum(s){
  s=String(s).toLowerCase().replace(/s\/|usd|\$/g,'').replace(/[\s,]/g,'');
  var neg=/^\(.*\)$/.test(s); if(neg) s=s.slice(1,-1);
  if(!/^-?\d*\.?\d+$/.test(s)) return NaN;
  var v=parseFloat(s); return neg?-v:v;
}
function tolFor(a){ return Math.abs(a)<100?0.011:1.01; }

function tableHTML(t){
  var h='<div class="tw"><table>';
  if(t.head){
    h+='<thead><tr>'+t.head.map(function(c,i){
      var numCol=t.rows.some(function(r){var v=String(r[i]===undefined?'':r[i]).replace(/^!/,''); return isNumCell(v);});
      return '<th'+(numCol&&i>0?' class="n"':'')+'>'+c+'</th>';
    }).join('')+'</tr></thead>';
  }
  h+='<tbody>'+t.rows.map(function(r){
    var bold=String(r[0]).charAt(0)==='!';
    return '<tr'+(bold?' class="b"':'')+'>'+r.map(function(c,i){
      var s=String(c===undefined?'':c); if(i===0&&bold) s=s.slice(1);
      return '<td'+(isNumCell(s)&&i>0?' class="n"':'')+'>'+s+'</td>';
    }).join('')+'</tr>';
  }).join('')+'</tbody></table></div>';
  return h;
}

/* ---------- Cuentas (como en tu examen) ---------- */
var ACC={
 '10':'Efectivo y equivalentes de efectivo','12':'Cuentas por cobrar comerciales','18':'Servicios y otros contratados por anticipado',
 '19':'Estimación de cuentas de cobranza dudosa','20':'Mercaderías','33':'Inmuebles, maquinaria y equipo','39':'Depreciación acumulada',
 '40':'Tributos por pagar (IGV, retenciones, IR)','41':'Remuneraciones y participaciones por pagar','42':'Cuentas por pagar comerciales',
 '45':'Obligaciones financieras','46':'Cuentas por pagar diversas','50':'Capital','58':'Reservas','59':'Resultados acumulados',
 '62':'Gastos de personal y directores','63':'Gastos de servicios prestados por terceros','65':'Otros gastos de gestión',
 '67':'Gastos financieros','68':'Valuación y deterioro de activos y provisiones','69':'Costo de ventas','70':'Ventas','77':'Ingresos financieros'};
var ACC_OPTS=Object.keys(ACC).map(function(k){return '<option value="'+k+'">'+k+' '+ACC[k]+'</option>';}).join('');

/* Hoja de asientos: FECHA | AD# | CUENTAS | DEBE | HABER. line = [cuenta, debe, haber, nombre opcional] */
function S(t,fecha,lines,glosa){ return {t:t,fecha:fecha,lines:lines,glosa:glosa}; }
function lineName(l){ return l[3]||ACC[l[0]]; }
function hojaHead(){
  return '<thead><tr><th><span class="mk">1</span>FECHA</th><th><span class="mk">2</span>AD#</th><th><span class="mk">3</span>CUENTAS</th><th class="n"><span class="mk">4</span>DEBE</th><th class="n"><span class="mk">5</span>HABER</th></tr></thead>';
}
function sheetShow(s){
  var h='<div class="tcap">'+s.t+'</div><div class="tw"><table class="hoja">'+hojaHead()+'<tbody>';
  s.lines.forEach(function(l,i){
    var cr=(l[1]===null||l[1]===undefined);
    h+='<tr><td class="f">'+(i===0?s.fecha:'')+'</td><td class="ad">'+l[0]+'</td><td'+(cr?' class="ind"':'')+'>'+lineName(l)+'</td><td class="n">'+m(l[1])+'</td><td class="n">'+m(l[2])+'</td></tr>';
  });
  h+='<tr class="gl"><td></td><td></td><td colspan="3"><span class="mk">6</span>x/x '+s.glosa+'</td></tr></tbody></table></div>';
  return h;
}
function sheetForm(ex,si,s){
  var n=s.lines.length+1, base=ex.id+'__s'+si+'_';
  var h='<div class="tcap">'+s.t+'</div><div class="tw"><table class="hoja" data-sheet="'+si+'">'+hojaHead()+'<tbody>';
  for(var r=0;r<n;r++){
    var id=base+r;
    h+='<tr data-r="'+r+'"><td class="f">'+(r===0?s.fecha:'')+'</td><td class="ad" id="'+id+'_ad">&nbsp;</td>'+
       '<td><select id="'+id+'_c" data-ad="'+id+'_ad" aria-label="Cuenta, fila '+(r+1)+'"><option value="">Elige la cuenta</option>'+ACC_OPTS+'</select><span class="rm" id="'+id+'_m"></span></td>'+
       '<td class="n"><input class="vn" id="'+id+'_d" type="text" inputmode="decimal" autocomplete="off" aria-label="Debe, fila '+(r+1)+'"></td>'+
       '<td class="n"><input class="vn" id="'+id+'_h" type="text" inputmode="decimal" autocomplete="off" aria-label="Haber, fila '+(r+1)+'"></td></tr>';
  }
  h+='<tr class="gl"><td></td><td></td><td colspan="3"><span class="mk">6</span><input class="glin" id="'+base+'g" type="text" placeholder="x/x Por el ... (la glosa no se califica)" aria-label="Glosa"></td></tr></tbody></table></div>';
  return h;
}
var LEG='<ol class="leg">'+
 '<li><b>FECHA</b>: solo en la primera fila de cada asiento.</li>'+
 '<li><b>AD#</b>: el número de la cuenta (63, 18, 68...).</li>'+
 '<li><b>CUENTAS</b>: primero las del Debe. Las del Haber van después, más a la derecha.</li>'+
 '<li><b>DEBE</b>: monto de las cuentas que van al Debe.</li>'+
 '<li><b>HABER</b>: monto de las cuentas que van al Haber. Debe y Haber suman lo mismo.</li>'+
 '<li><b>Última fila</b>: la glosa (x/x Por el...), una línea que explica el asiento.</li></ol>';

/* Kardex en el formato del examen */
function KX(rows,tot){ return {rows:rows,tot:tot}; }
function kxHead(){
  return '<thead><tr><th colspan="3">Documento</th><th rowspan="2">Fecha</th><th colspan="3">Entradas</th><th colspan="3">Salidas</th><th colspan="3">Saldos</th></tr>'+
   '<tr><th>Operación</th><th>Tipo</th><th>No.</th><th>Cantidad</th><th>Valor unit.</th><th>Valor tot.</th><th>Cantidad</th><th>Valor unit.</th><th>Valor tot.</th><th>Cantidad</th><th>Valor unit.</th><th>Valor tot.</th></tr></thead>';
}
function kxCell(v,j){ return j===1?mu(v):m(v); }
function kardexTable(ex,mode){
  var spec=ex.kardex, h='<div class="tw"><table class="kx">'+kxHead()+'<tbody>';
  spec.rows.forEach(function(r,i){
    h+='<tr><td>'+r.op+'</td><td>'+(r.tipo||'')+'</td><td>'+(r.no||'')+'</td><td>'+r.fecha+'</td>';
    ['e','s','sa'].forEach(function(k){
      for(var j=0;j<3;j++){
        var v=r[k]?r[k][j]:null;
        if(v===null||v===undefined){ h+='<td class="n na"></td>'; continue; }
        if(mode==='show'||r.given) h+='<td class="n">'+kxCell(v,j)+'</td>';
        else h+='<td class="n"><input type="text" inputmode="decimal" autocomplete="off" id="'+ex.id+'__kx'+i+k+j+'" aria-label="'+r.op+' '+r.fecha+', '+(k==='e'?'entradas':k==='s'?'salidas':'saldos')+' '+['cantidad','valor unitario','valor total'][j]+'"></td>';
      }
    });
    h+='</tr>';
  });
  var t=spec.tot;
  function tc(key,val){
    if(mode==='show') return '<td class="n">'+m(val)+'</td>';
    return '<td class="n"><input type="text" inputmode="decimal" autocomplete="off" id="'+ex.id+'__kt_'+key+'" aria-label="Totales '+key+'"></td>';
  }
  h+='<tr class="b"><td colspan="4">Totales</td>'+tc('e0',t.e0)+'<td class="n na"></td>'+tc('e2',t.e2)+tc('s0',t.s0)+'<td class="n na"></td>'+tc('s2',t.s2)+'<td class="n na"></td><td class="n na"></td><td class="n na"></td></tr>';
  return h+'</tbody></table></div>';
}
function kardexCells(ex){
  var out=[];
  ex.kardex.rows.forEach(function(r,i){
    if(r.given) return;
    ['e','s','sa'].forEach(function(k){ if(r[k]) for(var j=0;j<3;j++) out.push({id:ex.id+'__kx'+i+k+j,a:r[k][j]}); });
  });
  var t=ex.kardex.tot;
  out.push({id:ex.id+'__kt_e0',a:t.e0},{id:ex.id+'__kt_e2',a:t.e2},{id:ex.id+'__kt_s0',a:t.s0},{id:ex.id+'__kt_s2',a:t.s2});
  return out;
}

function G(label,a,b){ return {label:label,a:a,g:true,b:!!b}; }
function C(id,label,opts,a){ return {id:id,label:label,a:a,type:'choice',opts:opts}; }
function fieldHTML(ex,f){
  var id=ex.id+'__'+f.id, h='<div class="field fld" data-f="'+f.id+'"><label for="'+id+'">'+f.label+'</label>';

  else h+='<input id="'+id+'" type="text" inputmode="decimal" autocomplete="off" placeholder="0">';
  return h+'<div class="msg"></div></div>';
}
function stmtHTML(ex,mode,flds){
  var h='<div class="tw"><table class="stmt"><tbody>';
  (flds||ex.fields).forEach(function(f){
    if(f.h){ h+='<tr class="sh"><td colspan="3">'+f.h+'</td></tr>'; return; }

/* ===================== DEPRECIACION ===================== */
{id:'depreciacion',title:'Depreciación de activo fijo',short:'Depreciación',
 rule:'<ul>'+
 '<li>Depreciación anual = (costo − valor residual) ÷ años de vida útil. Mensual = anual ÷ 12.</li>'+
 '<li>Vida útil en %: 20% anual son 5 años, 10% son 10 años, 25% son 4 años (100 ÷ %).</li>'+
 '<li>Empieza el mes en que el activo está <b>disponible para uso</b>, no el de la compra.</li>'+
 '<li>El <b>terreno no se deprecia</b>.</li>'+
 '<li>Ajuste = depreciación correcta del año menos lo ya registrado. Si falta: Debe 68, Haber 39.</li></ul>',
 how:'<ol>'+HOJA_HOW+'<li>En depreciación el asiento casi siempre es el mismo: <b>Debe 68</b> Valuación y deterioro de activos, <b>Haber 39</b> Depreciación acumulada. Lo que cambia es el monto.</li><li>En el examen, la tabla del activo fijo trae el terreno: no lo depreciaste, no pongas nada para él.</li></ol>',
 real:[
 {id:'d-r1',title:'COMPUPLACE: camioneta de reparto',source:'PC2 2024-01, ajuste 5. El alumno la dejó en blanco (0 puntos).',

  steps:['El terreno <b>no se deprecia</b>.','Vida útil: 20% anual = 5 años.','Depreciación anual: (80,000 − 5,000) ÷ 5 = <b>15,000</b>. Mensual: 15,000 ÷ 12 = <b>1,250</b>.','Empieza en mayo (disponible el 01.05). Mayo a diciembre = <b>8 meses</b>.','Depreciación correcta de 2023: 8 × 1,250 = <b>10,000</b>.','Falta: 10,000 − 8,300 = <b>1,700</b>.'],
  sheets:[S('Ajuste 5','31/12',[['68',1700,null],['39',null,1700]],'Por el ajuste de la depreciación de la camioneta.')]},

/* ===================== ESTADO DE RESULTADOS ===================== */
{id:'resultados',title:'Estado de resultados y reserva legal',short:'Estado de resultados',
 rule:'<ol>'+
 '<li>Utilidad bruta = ventas − costo de ventas. <b>Se resta.</b></li>'+
 '<li>Utilidad operativa = utilidad bruta − gastos operativos (62, 63, 65, 68).</li>'+
 '<li>Utilidad antes de impuestos = utilidad operativa + ingresos financieros (77) − gastos financieros (67).</li>'+
 '<li>Impuesto a la renta = 29.5% de la utilidad antes de impuestos.</li>'+
 '<li>Utilidad neta = utilidad antes de impuestos − impuesto.</li>'+
 '<li>Reserva legal = el <b>menor</b> entre 10% de la utilidad neta y (20% del capital − reserva legal ya acumulada).</li>'+
 '<li>Utilidad de libre disposición = utilidad neta − reserva legal del año.</li></ol>',
 how:'<ol>'+
 '<li>El examen trae los saldos ajustados en una tabla. Las cuentas que van al estado de resultados son las que empiezan con 6 y 7 (69, 62, 63, 65, 67, 68 y 70, más la 77 si aparece).</li>'+
 '<li>Escribe el estado <b>en el orden del examen</b>: Ventas, (−) Costo de ventas, <b>Utilidad bruta</b>, los gastos operativos, <b>Utilidad operativa</b>, los gastos e ingresos financieros, <b>Utilidad antes de impuestos</b>, impuesto a la renta, <b>Utilidad neta</b>.</li>'+
 '<li>Escribe cada gasto como número <b>positivo</b>. El signo (−) ya está en el nombre de la línea.</li>'+
 '<li>Debajo va el recuadro <b>"Cálculo de reserva legal y utilidad de libre disposición"</b>: 10% de la utilidad neta, cuánto falta para el tope, la reserva del año y la utilidad libre.</li>'+
 '<li>El monto del impuesto sale de 29.5% de la utilidad antes de impuestos, no de las ventas.</li></ol>',
 real:[
 {id:'e-r1',title:'PUMA SAC: estado de resultados 2024',source:'PC2 202520, estados financieros. El alumno sacó 20/20.',

{id:'situacion',title:'Estado de situación financiera',short:'Situación financiera',
 rule:'<ul>'+
 '<li><b>Activo corriente:</b> efectivo (10), cuentas por cobrar (12) <b>neto de la 19</b>, gastos pagados por anticipado (18), mercaderías (20).</li>'+
 '<li><b>Activo no corriente:</b> inmuebles, maquinaria y equipo (33) <b>neto de la 39</b>.</li>'+
 '<li><b>Pasivo corriente:</b> IGV y otros tributos (40), remuneraciones (41), impuesto a la renta del año, cuentas por pagar que vencen dentro de 12 meses.</li>'+
 '<li><b>Pasivo no corriente:</b> lo que vence después. Si te dicen que parte de las cuentas por pagar vence más adelante, <b>divide la cuenta</b> en corriente y no corriente.</li>'+
 '<li><b>Patrimonio:</b> capital + reserva legal (la anterior más la del año) + resultados acumulados (los anteriores más la utilidad de libre disposición).</li>'+
 '<li>Comprobación: activo total = pasivo total + patrimonio.</li></ul>',
 how:'<ol>'+
 '<li>Primero haz el estado de resultados en tu borrador: necesitas la utilidad neta, el impuesto por pagar, la reserva legal del año y la utilidad de libre disposición.</li>'+

 '<li>En qué bloque va cada cuenta:</li></ol>'+tableHTMLStatic({head:['Cuenta','Bloque'],rows:[

 '<ol start="4"><li>El IR por pagar es la utilidad antes de impuestos × 29.5%. Va en el pasivo corriente porque aún no se paga.</li>'+
 '<li>Si Total activo es igual a Total pasivo y patrimonio, lo más probable es que esté bien.</li></ol>',

{id:'completo',title:'Ejercicio completo tipo examen',short:'Ejercicio tipo examen',
 rule:'<ol>'+
 '<li><b>Clasifica</b> cada cuenta del balance de comprobación: AC, ANC, PC, PNC, Patrimonio o estado de resultados.</li>'+
 '<li><b>Estado de resultados:</b> utilidad bruta, operativa y antes de impuestos. Después el IR de 29.5% y la utilidad neta.</li>'+
 '<li><b>Reserva legal del periodo</b> = el menor entre 10% de la utilidad neta y lo que falta para llegar al 20% del capital.</li>'+
 '<li><b>Utilidad de libre disposición</b> = utilidad neta − reserva del periodo.</li>'+
 '<li><b>Balance:</b> activos netos de la 19 y la 39. El <b>IR por pagar</b> va en el pasivo corriente. Las cuentas por pagar se dividen según la información adicional.</li>'+
 '<li><b>Cuadre:</b> total activo = total pasivo + patrimonio.</li></ol>',
 how:'<p>El examen es una hoja con <b>4 partes, siempre en este orden</b>:</p><ol>'+
 '<li><b>Los datos:</b> el balance de comprobación ajustado (las cuentas con sus saldos) y la información adicional. Aquí no escribes nada, solo lo lees.</li>'+
 '<li><b>Estado de resultados:</b> viene impreso hasta la <i>utilidad antes de impuestos</i>. Tú completas las líneas de abajo: impuesto, utilidad neta, reserva legal y utilidad de libre disposición.</li>'+
 '<li><b>Estado de situación financiera:</b> en blanco. Los activos van a la izquierda y los pasivos y el patrimonio a la derecha.</li>'+
 '<li><b>Tabla "Se solicita":</b> 9 números sueltos que el profe quiere ver aparte.</li></ol>'+
 '<p><b>¿Por qué se repiten los números?</b> Cada número se calcula <b>una sola vez</b> y después aparece en 2 o 3 lugares. Por ejemplo, la reserva legal se calcula en tu hoja de borrador, se escribe en el estado de resultados, se suma en el patrimonio del balance y vuelve a salir en la tabla "Se solicita". Por eso aquí lo hacemos en <b>5 pasos</b>: calculas cada cosa una vez y después la copias donde toque. Cada paso tiene su propio botón "Comprobar".</p>'+

    fields:[C('c0','Efectivo y equivalentes de efectivo',CLS,'Activo corriente'),C('c1','Cuentas por cobrar comerciales',CLS,'Activo corriente'),C('c2','Mercaderías',CLS,'Activo corriente'),C('c3','Propiedad, planta y equipo',CLS,'Activo no corriente'),C('c4','Depreciación y amortización acumulados',CLS,'Activo no corriente'),C('c5','Servicios y otros contratados por anticipado',CLS,'Activo corriente'),C('c6','Cuentas por pagar comerciales',CLS,'Se divide en corriente y no corriente'),C('c7','Obligaciones financieras',CLS,'Pasivo corriente'),C('c8','Capital',CLS,'Patrimonio'),C('c9','Reservas - Legal',CLS,'Patrimonio'),C('c10','Resultados acumulados',CLS,'Patrimonio'),C('c11','Ventas',CLS,'Estado de resultados'),C('c12','Ingresos financieros',CLS,'Estado de resultados'),C('c13','Costo de ventas',CLS,'Estado de resultados'),C('c14','Gastos de servicios prestados por terceros',CLS,'Estado de resultados'),C('c15','Otros gastos de gestión',CLS,'Estado de resultados')],

   {t:'Estado de resultados: impuesto y utilidad neta',kind:'stmt',
    teach:'<p>El examen ya trae <b>impreso</b> todo hasta la <b>utilidad antes de impuestos</b> (95,000). Tú solo completas dos líneas:</p><ol><li><b>Impuesto a la renta</b> = utilidad antes de impuestos × 29.5%.</li><li><b>Utilidad neta</b> = utilidad antes de impuestos − impuesto.</li></ol>',

    sol:['Impuesto: 95,000 × 0.295 = <b>28,025</b>.','Utilidad neta: 95,000 − 28,025 = <b>66,975</b>.']},
   {t:'Reserva legal y utilidad de libre disposición (tu hoja de borrador)',kind:'stmt',
    teach:'<p>La ley obliga a guardar cada año el <b>10% de la utilidad neta</b> como reserva legal, hasta que la reserva llegue al <b>20% del capital</b>. Por eso hay dos números y te quedas con el menor:</p><ol><li><b>a)</b> El 10% de la utilidad neta.</li><li><b>b)</b> El tope: 20% del capital.</li><li><b>c)</b> El espacio que queda: tope − la reserva que ya tienes.</li><li><b>d)</b> La reserva del periodo es el <b>menor</b> entre a) y c).</li></ol><p>Con eso sacas la reserva acumulada, la utilidad de libre disposición y los resultados acumulados totales. En el examen todo esto lo haces en la hoja de atrás: no está impreso.</p>',

function updateProgress(){
  var all=[]; topicsWork().forEach(function(t){ all=all.concat(topicIds(t)); });
  var d=count(all), p=all.length?Math.round(d*100/all.length):0;
  document.getElementById('ovPct').textContent=p+'%';
  document.getElementById('ovTxt').textContent=d+' de '+all.length+' ejercicios';
  var bar=document.getElementById('ovBar'); bar.setAttribute('aria-valuenow',String(p)); bar.firstElementChild.style.width=p+'%';
  bar.classList.toggle('ok',p===100);
  topicsWork().forEach(function(t){
    var ids=topicIds(t), c=count(ids), a=document.querySelector('[data-nav="'+t.id+'"]');
    if(a){ a.querySelector('.cnt').textContent=c+'/'+ids.length; a.classList.toggle('full',c===ids.length); }
  });
  var cur=currentTopic();
  if(cur&&!cur.special){
    var ids2=topicIds(cur), c2=count(ids2);
    var tb=document.getElementById('tbar'), tt=document.getElementById('ttxt');
    if(tb){ tb.firstElementChild.style.width=(ids2.length?Math.round(c2*100/ids2.length):0)+'%'; tb.classList.toggle('ok',c2===ids2.length); }
    if(tt){ tt.textContent=count((cur.real||[]).map(function(e){return e.id;}))+'/'+(cur.real||[]).length+' reales entendidos · '+count((cur.practice||[]).map(function(e){return e.id;}))+'/'+(cur.practice||[]).length+' prácticas resueltas'; }
  }
}

  var on=!!state.done[ex.id];
  var h='<article class="card" id="'+ex.id+'" data-ex="'+ex.id+'">'+
   '<div class="exh"><h4>'+ex.title+'</h4><span class="pill'+(on?' ok':'')+'" data-pill>'+(on?'Resuelto':'Pendiente')+'</span></div>'+
   '<div class="enun">'+ex.enun+'</div>'+(ex.enunTable?tableHTML(ex.enunTable):'');
  ex.blocks.forEach(function(b){
    h+='<section class="xs"><h5 class="xh">'+b.t+'</h5>'+blockForm(ex,b)+'</section>';
  });
  h+='<p class="hintline">Decimales con punto. Las comas de miles son opcionales. En importes grandes se acepta S/ 1 de diferencia. La depreciación y la estimación se escriben con signo menos (por ejemplo -5,000).</p>'+
     '<div class="actions"><button type="button" class="btn primary" data-action="checkexam">Calificar todo</button><button type="button" class="btn" data-action="clear">Borrar respuestas</button></div>'+
     '<p class="feedback" data-fb role="status" aria-live="polite"></p>'+
     '<details class="sol"><summary>Ver la hoja resuelta y los cálculos</summary>'+
     ex.blocks.map(function(b){return '<h5 class="xh">'+b.t+'</h5>'+blockShow(ex,b);}).join('')+
     '<div class="tcap">Cálculos</div>'+listSteps(ex.sol)+
     (ex.note?'<div class="note"><b>Ojo:</b> '+ex.note+'</div>':'')+'</details></article>';
  return h;
}
function practiceCard(ex){
  if(ex.exam) return practiceExam(ex);
  if(ex.blocks) return practiceBlocks(ex);
  var on=!!state.done[ex.id];
  var order=ex.kardex?['kardex','sheets','fields']:(ex.layout==='stmt'?['fields']:['fields','sheets']);
  var h='<article class="card" id="'+ex.id+'" data-ex="'+ex.id+'">'+
   '<div class="exh"><h4>'+ex.title+'</h4><span class="pill'+(on?' ok':'')+'" data-pill>'+(on?'Resuelto':'Pendiente')+'</span></div>'+
   '<div class="enun">'+ex.enun+'</div>'+(ex.enunTable?tableHTML(ex.enunTable):'');
  var n=0;
  order.forEach(function(k){
    if(k==='kardex'&&ex.kardex){ n++; h+=stp(n,'Tabla del Kardex')+kardexTable(ex,'form'); }
    else if(k==='sheets'&&ex.sheets){ n++; h+=stp(n,'Hoja de asientos'); ex.sheets.forEach(function(sh,i){ h+=sheetForm(ex,i,sh); }); }
    else if(k==='fields'&&ex.fields){
      n++; h+=stp(n,ex.fieldsTitle||'Tu hoja de examen');
      h+=ex.layout==='stmt'?stmtHTML(ex,'form'):'<div class="fields">'+ex.fields.map(function(f){return fieldHTML(ex,f);}).join('')+'</div>';
    }
  });
  h+='<p class="hintline">Decimales con punto (11.20). Las comas de miles son opcionales. En importes grandes se acepta S/ 1 de diferencia por redondeo.'+(ex.sheets?' Elige la cuenta en la lista: el número de cuenta (AD#) aparece solo. La glosa no se califica.':'')+'</p>';
  h+='<div class="actions"><button type="button" class="btn primary" data-action="check">Comprobar</button><button type="button" class="btn" data-action="clear">Borrar respuestas</button></div>'+
     '<p class="feedback" data-fb role="status" aria-live="polite"></p>'+
     '<details class="sol"><summary>Ver solución paso a paso y la hoja llenada</summary>'+stp(1,'Cálculos')+stepsHTML(ex)+stp(2,'Así queda tu hoja de examen')+showParts(ex)+(ex.sheets?LEG:'')+(ex.note?'<div class="note"><b>Ojo:</b> '+ex.note+'</div>':'')+'</details></article>';
  return h;
}
function topicHTML(t){
  var h='<div class="thead"><h2>'+t.title+'</h2><div class="sub"><span id="ttxt"></span></div><div class="bar" id="tbar" role="presentation"><span></span></div></div>';
  h+='<div class="card rule"><h3>Reglas de este tema</h3>'+t.rule+'</div>';
  if(t.how) h+='<div class="card rule"><h3>Cómo se llena en tu examen</h3>'+t.how+'</div>';
  if(t.examMode){ h+='<h3 class="sec"><span class="tag">1</span>Hojas en blanco para llenar</h3>'; }
  else {
    h+='<h3 class="sec"><span class="tag">1</span>Ejercicios reales resueltos</h3>';
    h+=t.real.map(realCard).join('');
    h+='<h3 class="sec"><span class="tag">2</span>Ahora tú</h3>';
  }
  h+=t.practice.map(practiceCard).join('');
  var w=topicsWork(), i=w.indexOf(t), prev=i>0?w[i-1]:TOPICS[0], next=i<w.length-1?w[i+1]:null;
  h+='<div class="pager"><a href="#'+prev.id+'">← '+prev.short+'</a>'+(next?'<a href="#'+next.id+'">'+next.short+' →</a>':'<span></span>')+'</div>';
  return h;
}

/* ---------- Comprobación ---------- */
function checkKardex(ex){
  var cells=kardexCells(ex), ok=0;
  cells.forEach(function(c){
    var el=document.getElementById(c.id), n=parseNum(el.value);
    var good=el.value.trim()!==''&&!isNaN(n)&&Math.abs(n-c.a)<=tolFor(c.a);
    el.classList.remove('ok','bad'); el.classList.add(good?'ok':'bad'); if(good) ok++;
  });
  return {ok:ok,total:cells.length};
}
function checkSheet(ex,si,s){
  var base=ex.id+'__s'+si+'_', n=s.lines.length+1, rows=[];
  for(var r=0;r<n;r++){
    var selEl=document.getElementById(base+r+'_c');
    var c=selEl.value, dv=document.getElementById(base+r+'_d').value.trim(), hv=document.getElementById(base+r+'_h').value.trim();
    var tr=selEl.closest('tr');
    tr.classList.remove('ok','bad'); document.getElementById(base+r+'_m').textContent='';
    if(c===''&&dv===''&&hv==='') continue;
    rows.push({r:r,tr:tr,c:c,d:dv===''?null:parseNum(dv),h:hv===''?null:parseNum(hv),dRaw:dv,hRaw:hv,used:false});
  }
  var exp=s.lines.map(function(l){
    var isD=(l[1]!==null&&l[1]!==undefined);
    return {code:l[0],side:isD?'d':'h',amt:isD?l[1]:l[2],matched:false};
  });
  exp.forEach(function(e){
    for(var i=0;i<rows.length;i++){
      var u=rows[i]; if(u.used) continue;
      var mine=e.side==='d'?u.d:u.h, other=e.side==='d'?u.h:u.d;
      if(u.c===e.code&&mine!==null&&!isNaN(mine)&&Math.abs(mine-e.amt)<=tolFor(e.amt)&&other===null){ u.used=true; e.matched=true; break; }
    }
  });
  var bad=0;
  rows.forEach(function(u){
    var msgEl=document.getElementById(base+u.r+'_m');
    if(u.used){ u.tr.classList.add('ok'); msgEl.textContent='Correcto'; return; }
    bad++; u.tr.classList.add('bad');
    var msg;
    if(u.c==='') msg='Elige la cuenta';
    else if((u.dRaw!==''&&isNaN(u.d))||(u.hRaw!==''&&isNaN(u.h))) msg='Escribe solo un número';
    else if(u.d!==null&&u.h!==null) msg='Una cuenta va solo en el Debe o solo en el Haber';
    else if(u.d===null&&u.h===null) msg='Falta el monto';
    else if(exp.some(function(e){return !e.matched&&e.code===u.c;})) msg='Revisa el monto o si va al Debe o al Haber';
    else msg='Esta cuenta no va en este asiento';
    msgEl.textContent=msg;
  });
  var missing=exp.filter(function(e){return !e.matched;}).length;
  return {ok:bad===0&&missing===0,total:exp.length,good:exp.length-missing,missing:missing};
}
function checkFields(ex,flds){
  var total=0, ok=0;
  (flds||ex.fields).forEach(function(f){
    if(f.h||f.g) return;
    total++;
    var el=document.getElementById(ex.id+'__'+f.id), box=el.closest('.fld'), msg=box.querySelector('.msg'), good=false, blank=false, v=el.value;
    if(f.type==='choice'){ blank=(v===''); good=(v===f.a); }
    else { blank=(String(v).trim()===''); var n=parseNum(v); good=!isNaN(n)&&Math.abs(n-f.a)<=tolFor(f.a); }
    box.classList.remove('ok','bad');
    if(blank){ box.classList.add('bad'); msg.textContent='Falta responder'; }
    else if(good){ box.classList.add('ok'); msg.textContent='Correcto'; ok++; }
    else { box.classList.add('bad'); msg.textContent=(f.type==='num'&&isNaN(parseNum(v)))?'Escribe solo un número':'Revisa este dato'; }
  });
  return {ok:ok,total:total};
}
function checkCard(card,ex){
  var parts=[], allOk=true, r;
  if(ex.kardex){ r=checkKardex(ex); parts.push('Kardex: '+r.ok+' de '+r.total+' celdas'); if(r.ok!==r.total) allOk=false; }
  if(ex.sheets){
    var g=0,t=0,sok=true;
    ex.sheets.forEach(function(s,i){ var q=checkSheet(ex,i,s); g+=q.good; t+=q.total; if(!q.ok) sok=false; });
    parts.push('Asientos: '+g+' de '+t+' líneas'); if(!sok) allOk=false;
  }
  if(ex.fields){ r=checkFields(ex); parts.push((ex.layout==='stmt'?'Estado':'Cálculos')+': '+r.ok+' de '+r.total); if(r.ok!==r.total) allOk=false; }
  var fb=card.querySelector('[data-fb]');
  if(allOk){
    state.done[ex.id]=true; save();
    fb.className='feedback ok'; fb.textContent='Todo correcto. Ejercicio resuelto.';
    var p=card.querySelector('[data-pill]'); p.textContent='Resuelto'; p.classList.add('ok');
  } else {
    fb.className='feedback bad';
    fb.textContent='Aún hay errores en lo marcado en rojo. '+parts.join(' · ')+'. Corrige o abre la solución.';
  }
  updateProgress();
}
function checkExam(card,ex){
  var parts=[], ok=0, total=0, allOk=true;
  ex.blocks.forEach(function(b){
    var r=checkFields(ex,blockFields(b)); ok+=r.ok; total+=r.total; if(r.ok!==r.total) allOk=false;
    parts.push(b.t.replace('Estado de resultados integrales','Estado de resultados').replace('Estado de situación financiera','Situación financiera')+': '+r.ok+' de '+r.total);
  });
  var fb=card.querySelector('[data-fb]'), pill=card.querySelector('[data-pill]');
  if(allOk){
    state.done[ex.id]=true; save();
    pill.textContent='Resuelto'; pill.classList.add('ok');
    fb.className='feedback ok'; fb.textContent='Todo correcto ('+ok+' de '+total+'). Caso resuelto.';
  } else {
    fb.className='feedback bad'; fb.textContent=parts.join(' · ')+'. Corrige lo marcado en rojo y vuelve a calificar.';
  }
  updateProgress();
}
function checkBlock(card,ex,bi){
  var blk=ex.blocks[bi], sec=card.querySelector('.blk[data-b="'+bi+'"]');
  var r=checkFields(ex,blockFields(blk));
  var fb=sec.querySelector('[data-bfb]'), pill=sec.querySelector('[data-bpill]');
  if(r.ok===r.total){
    state.blocks[ex.id+':'+bi]=true;
    fb.className='feedback ok'; fb.textContent='Paso correcto.'; pill.textContent='Correcto'; pill.classList.add('ok');
    var all=ex.blocks.every(function(x,i){return state.blocks[ex.id+':'+i];});
    if(all){
      state.done[ex.id]=true;
      var p=card.querySelector('[data-pill]'); p.textContent='Resuelto'; p.classList.add('ok');
      fb.textContent='Paso correcto. Ejercicio completo resuelto.';
    }
    save();
  } else {
    fb.className='feedback bad'; fb.textContent=r.ok+' de '+r.total+' correctas. Revisa lo marcado en rojo o abre el cálculo de este paso.';
  }
  updateProgress();
}
function clearCard(card){
  Array.prototype.forEach.call(card.querySelectorAll('input,select'),function(el){ el.value=''; el.classList.remove('ok','bad'); });
  Array.prototype.forEach.call(card.querySelectorAll('.fld,tr.ok,tr.bad'),function(el){ el.classList.remove('ok','bad'); });
  Array.prototype.forEach.call(card.querySelectorAll('.msg,.rm'),function(el){ el.textContent=''; });
  Array.prototype.forEach.call(card.querySelectorAll('td.ad'),function(el){ if(el.id) el.innerHTML='&nbsp;'; });
  var fb=card.querySelector('[data-fb]'); if(fb){ fb.className='feedback'; fb.textContent=''; }
  Array.prototype.forEach.call(card.querySelectorAll('[data-bfb]'),function(el){ el.className='feedback'; el.textContent=''; });
}

/* ---------- Router y eventos ---------- */
var main=document.getElementById('main');
function show(){
  var id=(location.hash||'').replace('#','');
  var t=TOPICS.filter(function(x){return x.id===id;})[0]||TOPICS[0];
  curId=t.id;
  main.innerHTML=t.special?resumenHTML():topicHTML(t);
  Array.prototype.forEach.call(document.querySelectorAll('#nav a'),function(a){
    if(a.getAttribute('data-nav')===t.id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  try{ window.scrollTo(0,0); }catch(e){}
  updateProgress();
}
function buildNav(){
  document.getElementById('nav').innerHTML=TOPICS.map(function(t){
    return '<a href="#'+t.id+'" data-nav="'+t.id+'"><span>'+t.short+'</span><span class="cnt"></span></a>';
  }).join('');
}
main.addEventListener('click',function(e){
  var b=e.target.closest('[data-action]'); if(!b) return;
  var card=b.closest('[data-ex]'); if(!card) return;
  var ex=findEx(card.getAttribute('data-ex')); if(!ex) return;
  var a=b.getAttribute('data-action');
  if(a==='check') checkCard(card,ex);
  else if(a==='checkexam') checkExam(card,ex);
  else if(a==='checkblock') checkBlock(card,ex,+b.getAttribute('data-b'));
  else if(a==='clear') clearCard(card);
  else if(a==='understood'){
    var on=!state.done[ex.id]; if(on) state.done[ex.id]=true; else delete state.done[ex.id]; save();
    b.setAttribute('aria-pressed',on?'true':'false'); b.textContent=on?'Lo entendí ✓':'Marcar como entendido';
    var p=card.querySelector('[data-pill]'); p.textContent=on?'Entendido':'Por leer'; p.classList.toggle('ok',on);
    updateProgress();
  }
});
main.addEventListener('change',function(e){
  var sel=e.target.closest('select[data-ad]'); if(!sel) return;
  var cell=document.getElementById(sel.getAttribute('data-ad'));
  if(cell) cell.textContent=sel.value===''?' ':sel.value;
});
main.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.tagName==='INPUT'){
    var card=e.target.closest('[data-ex]'); if(!card) return;
    var ex=findEx(card.getAttribute('data-ex'));
    var sec=e.target.closest('.blk');
    if(ex&&ex.blocks&&sec){ e.preventDefault(); checkBlock(card,ex,+sec.getAttribute('data-b')); return; }
    if(ex&&(ex.fields||ex.sheets||ex.kardex)&&card.querySelector('[data-action=check]')){ e.preventDefault(); checkCard(card,ex); }
  }
});
document.querySelector('footer.foot').addEventListener('click',function(e){
  var box=document.getElementById('resetBox');
  if(e.target.id==='resetBtn'){
    box.innerHTML='<p>¿Borrar todo tu progreso?</p><button type="button" class="btn primary" id="resetYes">Sí, borrar</button><button type="button" class="btn" id="resetNo">Cancelar</button>';
  } else if(e.target.id==='resetNo'){
    box.innerHTML='<button type="button" class="btn" id="resetBtn">Borrar progreso</button>';
  } else if(e.target.id==='resetYes'){
    state={done:{},blocks:{}}; save(); show();
    box.innerHTML='<button type="button" class="btn" id="resetBtn">Borrar progreso</button>';
  }
});
window.addEventListener('hashchange',show);

buildNav();
show();
})();
</script>
